<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creations AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div class="logo">
                <span class="logo-symbol">✦</span>
                <span>Creations AI</span>
            </div>

            <button id="newChatButton">＋ New Chat</button>
        </header>


        <main class="chat-area" id="chatArea">

            <section class="welcome" id="welcome">

                <div class="welcome-icon">✦</div>

                <h1>What can I help you create?</h1>

                <p>
                    Stories, ideas, characters, questions and more.
                </p>

            </section>

        </main>


        <footer class="composer">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message Creations AI..."
                    rows="1"
                ></textarea>

                <button id="sendButton" aria-label="Send message">
                    ➤
                </button>

            </div>

            <p class="disclaimer">
                Creations AI can make mistakes. Check important information.
            </p>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
